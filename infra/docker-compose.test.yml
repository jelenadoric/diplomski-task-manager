services:
  postgres-test:
    image: postgres:16
    container_name: diplomski-postgres-test

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diplomski_test

    ports:
      - "5434:5432"

    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d diplomski_test"
        ]
      interval: 2s
      timeout: 5s
      retries: 10