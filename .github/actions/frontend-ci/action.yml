name: Frontend CI Composite Action
description: Install frontend dependencies, run lint and tests, and build frontend

outputs:
  frontend_install_duration_sec:
    description: Frontend install duration in seconds
    value: ${{ steps.frontend_install_end.outputs.duration }}

  frontend_lint_duration_sec:
    description: Frontend lint duration in seconds
    value: ${{ steps.frontend_lint_end.outputs.duration }}

  frontend_test_duration_sec:
    description: Frontend test duration in seconds
    value: ${{ steps.frontend_test_end.outputs.duration }}

  frontend_build_duration_sec:
    description: Frontend build duration in seconds
    value: ${{ steps.frontend_build_end.outputs.duration }}

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Start frontend install timer
      id: frontend_install_start
      shell: bash
      run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Install frontend dependencies
      shell: bash
      working-directory: frontend
      run: npm ci

    - name: Stop frontend install timer
      id: frontend_install_end
      shell: bash
      run: |
        end=$(date +%s)
        start=${{ steps.frontend_install_start.outputs.ts }}
        echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

    - name: Start frontend lint timer
      id: frontend_lint_start
      shell: bash
      run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Run frontend lint
      shell: bash
      working-directory: frontend
      run: npm run lint

    - name: Stop frontend lint timer
      id: frontend_lint_end
      shell: bash
      run: |
        end=$(date +%s)
        start=${{ steps.frontend_lint_start.outputs.ts }}
        echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

    - name: Start frontend test timer
      id: frontend_test_start
      shell: bash
      run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Run frontend tests
      shell: bash
      working-directory: frontend
      run: npm test

    - name: Stop frontend test timer
      id: frontend_test_end
      shell: bash
      run: |
        end=$(date +%s)
        start=${{ steps.frontend_test_start.outputs.ts }}
        echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"

    - name: Start frontend build timer
      id: frontend_build_start
      shell: bash
      run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Build frontend
      shell: bash
      working-directory: frontend
      run: npm run build

    - name: Stop frontend build timer
      id: frontend_build_end
      shell: bash
      run: |
        end=$(date +%s)
        start=${{ steps.frontend_build_start.outputs.ts }}
        echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"